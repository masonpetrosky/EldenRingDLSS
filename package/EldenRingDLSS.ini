; Elden Ring DLSS settings. Most are also in the ReShade overlay (Home key, "Add-ons" tab), which saves them here.

[EldenRingDLSS]
; 1 = DLSS, 0 = the game's TAA. F9 toggles it in game (ToggleKey, a Windows virtual key code).
Enabled=1
ToggleKey=120
; DLSS preset: 0 = NVIDIA's default for the mode (K for DLAA, Quality and Balanced, M for Performance), 5 = E (the
; older CNN model, about half of K's cost), 11 = K, 12 = L, 13 = M. M and L cost more than K, much more on RTX 20
; and 30 cards.
Preset=0
; Render size per axis. 1.0 = DLAA (native resolution). Below 1 DLSS upscales: 0.67 = Quality, 0.58 = Balanced,
; 0.50 = Performance. Upscaling is tested at 4K only; start the game with the scale you want (a change from 1.0 to
; a lower value at runtime needs a restart).
RenderScale=1.00
; Give DLSS the game's exposure (recommended) instead of DLSS's own auto-exposure.
GameExposure=1
; Run the game's TAA sharpening filter on the DLSS output, with this strength (the game uses 0.25).
GameSharpening=0
SharpenStrength=0.25
; Texture LOD bias for DLAA; log2(RenderScale) is added when upscaling. Needs a restart.
MipBias=-1.00
; 1 keeps the game's chromatic aberration, 0 removes it.
ChromaticAberration=1
; Motion vectors for wind-animated grass and bushes, which the game does not write (without them DLSS smears swaying
; vegetation). About 1 ms at 4K in dense grass. WindTrees=1 adds SpeedTree trees and shrubs, about 2 ms more at 4K
; with trees in view.
WindMotion=1
WindTrees=0
; Motion vectors for enemies, NPCs and animals: the game only writes them for your own character, so without them
; DLSS smears everything else that moves. About 0.2-0.3 ms.
NpcMotion=1
; With the game's Motion Blur on: blur only what moves (enemies, animals, swings), not camera turns. About 0.1 ms.
ObjectBlur=0
; Experimental: NVIDIA Reflex low-latency mode, started at the present (the add-on cannot see the game's own frame
; start). In testing it cut the queued GPU work by about 8 ms and cost about 3% of the frame rate.
Reflex=0
; DLSS Ray Reconstruction while the game's ray tracing is on (needs nvngx_dlssd.dll; also in the overlay). It
; replaces the game's ray tracing denoisers, which blur the sun shadows of grass and leaves and ghost under trees.
; Best with upscaling: at 4K on an RTX 5070 Ti it takes about 4 ms at RenderScale 0.50 and 12 ms at 1.00, partly
; paid back by the denoisers it replaces.
RayReconstruction=0
; Under Ray Reconstruction, 4 = the add-on traces the ambient occlusion and sun shadows itself (one ray each per pixel
; at the render size, temporal blue noise), cleaner and cheaper there than the game's rays; 3 = the same with blue
; noise that does not spread over frames; 0 = the game's rays. Without Ray Reconstruction the game's own rays run
; either way.
RtShadowRayGen=4
; Water reflections at the native size while upscaling (also in the overlay): the game traces the water's
; reflections at half the render size, so below RenderScale 1 they get coarse and noisy (at 0.50 a quarter of the
; native detail). 1 traces them at the native size again; about 190 MB of video memory at 4K and 0.50.
WaterReflections=1
